name: Normalize Missing Semester headings

on:
  push:
    paths:
      - '.github/workflows/normalize-missing-semester-headings.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize heading levels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('source/missing-semester')
          skip = {'index.md', 'course-shell.md'}

          for path in sorted(root.glob('*.md')):
              if path.name in skip:
                  continue

              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              in_fence = False
              first_h1_seen = False
              changed = False

              for line in lines:
                  stripped = line.lstrip()
                  if stripped.startswith('```') or stripped.startswith('````'):
                      in_fence = not in_fence
                      out.append(line)
                      continue

                  if not in_fence:
                      m = re.match(r'^(#{1,5})(\s+.+)$', line)
                      if m:
                          level = len(m.group(1))
                          if level == 1 and not first_h1_seen:
                              first_h1_seen = True
                          else:
                              line = '#' + line
                              changed = True

                  out.append(line)

              if changed:
                  path.write_text(''.join(out), encoding='utf-8')
                  print(f'normalized {path}')
          PY

      - name: Commit normalized headings
        run: |
          if git diff --quiet; then
            echo 'No heading changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/missing-semester/*.md
          git commit -m 'fix: normalize Missing Semester heading levels'
          git push
